apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: custom-scheduler-webhook      # webhook group name
webhooks:
  - name: scheduler.webhook.k8s.io    # webhook name
    rules:                            # when should webhook be triggered
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    clientConfig:                      # webhook server details [where webhook is running]
      service:                         # webhook service details
        name: custom-k8s-scheduler     
        namespace: default
        path: /mutate
      caBundle: 
    admissionReviewVersions: ["v1"]    # version of admission review
    sideEffects: None                  # side effects of webhook [none means no side effect outside of the request]